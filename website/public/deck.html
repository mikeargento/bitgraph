<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BitGraph</title>
<link rel="stylesheet" href="https://use.typekit.net/svq0oqy.css">
<style>
  /* The deck, reduced to its function: a door into bitgraph.ing.
     House system: #f5f5f5, brand #0065A4 in text only, square corners,
     Acumin Pro via Typekit when served from bitgraph.ing, system sans
     otherwise. No em dashes anywhere. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #f5f5f5;
    font-family: "acumin-pro", -apple-system, "Helvetica Neue", Inter, Arial, sans-serif;
    color: #111827;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    /* Home's one-line rule: 22px floor on a 6vw slope holds the sentence
       on a single line down to 360px phones. */
    font-size: clamp(22px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: -0.015em;
    line-height: 1.12;
  }
  h1 .place { color: #0065A4; }
  /* The site's action-link idiom (.bg-action-link): no underline, the
     arrow travels on hover, same gap and tracking. */
  .start {
    margin-top: 42px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #0065A4;
    text-decoration: none;
  }
  .start .arrow { display: inline-block; transition: transform .18s ease; }
  @media (hover: hover) { .start:hover .arrow { transform: translateX(3px); } }
  .start:focus-visible { outline: 2px solid #0065A4; outline-offset: 3px; }
  footer {
    padding: 20px 24px 26px;
    text-align: center;
    font-size: 13px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <main>
    <h1>A BitGraph gives bits <span class="place">a place</span>.</h1>
    <a class="start" href="https://bitgraph.ing">Start here<span class="arrow" aria-hidden="true">&rarr;</span></a>
  </main>
  <footer>Mike Argento &middot; Buffalo, NY &middot; 2026</footer>
</body>
</html>
